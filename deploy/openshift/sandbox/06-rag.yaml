apiVersion: apps/v1
kind: Deployment
metadata:
  name: notetaker-rag
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"notetaker-rag:latest"},
        "fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notetaker-rag
  template:
    metadata:
      labels:
        app: notetaker-rag
    spec:
      containers:
        - name: rag
          image: image-registry.openshift-image-registry.svc:5000/$(NAMESPACE)/notetaker-rag:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: notetaker-config
          env:
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: QDRANT_API_KEY
            - name: WATSONX_APIKEY
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: WATSONX_APIKEY
            - name: WATSONX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: WATSONX_PROJECT_ID
            - name: WATSONX_URL
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: WATSONX_URL
            - name: VECTOR_SIZE
              value: "1024"
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notetaker-rag
spec:
  selector:
    app: notetaker-rag
  ports:
    - name: http
      port: 8001
      targetPort: 8001
