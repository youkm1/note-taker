apiVersion: apps/v1
kind: Deployment
metadata:
  name: notetaker-stt
  annotations:
    # ImageStream 변경 시 파드 자동 롤링 업데이트
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"notetaker-stt:latest"},
        "fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notetaker-stt
  template:
    metadata:
      labels:
        app: notetaker-stt
    spec:
      containers:
        - name: stt
          # 빌드 전엔 placeholder. ImageStream 트리거가 실제 digest로 교체함.
          image: image-registry.openshift-image-registry.svc:5000/$(NAMESPACE)/notetaker-stt:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: notetaker-config
          env:
            - name: RTZR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: RTZR_CLIENT_ID
            - name: RTZR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: RTZR_CLIENT_SECRET
            - name: IBM_STT_APIKEY
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: IBM_STT_APIKEY
                  optional: true
            - name: IBM_STT_URL
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: IBM_STT_URL
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notetaker-stt
spec:
  selector:
    app: notetaker-stt
  ports:
    - name: http
      port: 8000
      targetPort: 8000
