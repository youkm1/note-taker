# Secret 템플릿 — 실제 값은 절대 커밋하지 말 것.
# 아래 명령으로 직접 생성:
#
#   oc create secret generic notetaker-secrets \
#     --from-literal=GEMINI_API_KEY='...' \
#     --from-literal=GEMINI_API_KEY_EVAL='...' \
#     --from-literal=QDRANT_API_KEY='...' \
#     --from-literal=RTZR_CLIENT_ID='...' \
#     --from-literal=RTZR_CLIENT_SECRET='...' \
#     --from-literal=IBM_STT_APIKEY='...' \
#     --from-literal=IBM_STT_URL='...'
#
# IBM STT는 벤치마크용. 값이 없으면 두 항목 모두 빈 문자열('')로 주면 됨.
apiVersion: v1
kind: Secret
metadata:
  name: notetaker-secrets
type: Opaque
stringData:
  GEMINI_API_KEY: "replace-me"
  GEMINI_API_KEY_EVAL: "replace-me"
  QDRANT_API_KEY: "replace-me"
  RTZR_CLIENT_ID: "replace-me"
  RTZR_CLIENT_SECRET: "replace-me"
  IBM_STT_APIKEY: ""
  IBM_STT_URL: ""
