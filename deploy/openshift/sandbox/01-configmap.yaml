apiVersion: v1
kind: ConfigMap
metadata:
  name: notetaker-config
data:
  # STT: RTZR API (Whisper 없음 — Sandbox 7Gi 쿼터 보호)
  STT_PROVIDER: "rtzr"
  RTZR_POLL_INTERVAL: "5"
  RTZR_TIMEOUT: "900"

  # Qdrant Cloud (URL은 여기, API 키는 Secret)
  # 형식: https://<cluster-id>.eu-west-1-0.aws.cloud.qdrant.io:6333
  QDRANT_URL: "https://b64012b7-75ad-4e35-b6f5-8452375624ba.eu-west-1-0.aws.cloud.qdrant.io:6333"
  QDRANT_COLLECTION: "notes"
  VECTOR_SIZE: "3072"

  # RAG
  RERANKER_MODEL: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  RAG_URL: "http://notetaker-rag:8001"

  # Eval / RAGAS
  RAG_QUERY_TIMEOUT_SECONDS: "120"
  RAGAS_TIMEOUT_SECONDS: "600"
  RAGAS_MAX_WORKERS: "2"
  RAGAS_MAX_RETRIES: "3"
  RAGAS_MAX_WAIT_SECONDS: "60"
  RAGAS_BATCH_SIZE: "1"

  # HuggingFace 캐시 — OpenShift non-root 환경
  HF_HOME: "/tmp/huggingface"
  TRANSFORMERS_CACHE: "/tmp/huggingface/transformers"
  SENTENCE_TRANSFORMERS_HOME: "/tmp/sentence-transformers"
  XDG_CACHE_HOME: "/tmp/.cache"
