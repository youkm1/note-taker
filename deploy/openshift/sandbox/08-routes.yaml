# TLS edge termination: 라우터가 HTTPS 처리 → 파드엔 HTTP로 전달.
# Route 생성 후 URL: oc get routes
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: notetaker-stt
spec:
  to:
    kind: Service
    name: notetaker-stt
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
