apiVersion: apps/v1
kind: Deployment
metadata:
  name: notetaker-eval
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"notetaker-eval:latest"},
        "fieldPath":"spec.template.spec.containers[0].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notetaker-eval
  template:
    metadata:
      labels:
        app: notetaker-eval
    spec:
      containers:
        - name: eval
          image: image-registry.openshift-image-registry.svc:5000/$(NAMESPACE)/notetaker-eval:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: notetaker-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: GEMINI_API_KEY_EVAL
            - name: WATSONX_APIKEY
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: WATSONX_APIKEY
            - name: WATSONX_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: WATSONX_PROJECT_ID
            - name: WATSONX_URL
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: WATSONX_URL
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notetaker-eval
spec:
  selector:
    app: notetaker-eval
  ports:
    - name: http
      port: 8002
      targetPort: 8002
