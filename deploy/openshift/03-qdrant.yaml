apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notetaker-qdrant
  labels:
    app: notetaker-qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notetaker-qdrant
  template:
    metadata:
      labels:
        app: notetaker-qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
              name: http
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: notetaker-qdrant
spec:
  selector:
    app: notetaker-qdrant
  ports:
    - name: http
      port: 6333
      targetPort: 6333

