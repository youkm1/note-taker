apiVersion: apps/v1
kind: Deployment
metadata:
  name: notetaker-rag
  labels:
    app: notetaker-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notetaker-rag
  template:
    metadata:
      labels:
        app: notetaker-rag
    spec:
      containers:
        - name: rag
          image: icr.io/<registry-namespace>/note-taker-rag:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
              name: http
          envFrom:
            - configMapRef:
                name: notetaker-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: GEMINI_API_KEY
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notetaker-rag
spec:
  selector:
    app: notetaker-rag
  ports:
    - name: http
      port: 8001
      targetPort: 8001

