apiVersion: apps/v1
kind: Deployment
metadata:
  name: notetaker-stt
  labels:
    app: notetaker-stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notetaker-stt
  template:
    metadata:
      labels:
        app: notetaker-stt
    spec:
      containers:
        - name: stt
          image: icr.io/<registry-namespace>/note-taker-stt:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: notetaker-config
          env:
            - name: IBM_STT_APIKEY
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: IBM_STT_APIKEY
                  optional: true
            - name: IBM_STT_URL
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: IBM_STT_URL
                  optional: true
            - name: RTZR_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: RTZR_CLIENT_ID
                  optional: true
            - name: RTZR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: notetaker-secrets
                  key: RTZR_CLIENT_SECRET
                  optional: true
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: notetaker-stt
spec:
  selector:
    app: notetaker-stt
  ports:
    - name: http
      port: 8000
      targetPort: 8000

