
services:
  stt:
    build:
      context: .
      dockerfile: stt/Dockerfile
    container_name: notetaker-stt
    environment:
      - STT_PROVIDER=${STT_PROVIDER:-whisper}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-large-v3-turbo}
      - WHISPER_HF_MODEL=${WHISPER_HF_MODEL:-}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
      - IBM_STT_APIKEY=${IBM_STT_APIKEY:-}
      - IBM_STT_URL=${IBM_STT_URL:-}
      - IBM_STT_MODEL=${IBM_STT_MODEL:-ko-KR_Multimedia}
      - IBM_STT_TIMEOUT=${IBM_STT_TIMEOUT:-900}
      - IBM_STT_LEARNING_OPT_OUT=${IBM_STT_LEARNING_OPT_OUT:-true}
      - IBM_STT_CUSTOMER_ID=${IBM_STT_CUSTOMER_ID:-notetaker}
      - RTZR_CLIENT_ID=${RTZR_CLIENT_ID:-}
      - RTZR_CLIENT_SECRET=${RTZR_CLIENT_SECRET:-}
      - RTZR_POLL_INTERVAL=${RTZR_POLL_INTERVAL:-5}
      - RTZR_TIMEOUT=${RTZR_TIMEOUT:-900}
    ports:
      - "8000:8000"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: notetaker-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    container_name: notetaker-rag
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-notes}
      - VECTOR_SIZE=${VECTOR_SIZE:-3072}
      - RERANKER_MODEL=${RERANKER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    ports:
      - "8001:8001"
    depends_on:
      - qdrant
    restart: unless-stopped

  eval:
    build:
      context: .
      dockerfile: eval/Dockerfile
    container_name: notetaker-eval
    environment:
      - RAG_URL=http://rag:8001
      - GEMINI_API_KEY=${GEMINI_API_KEY_EVAL}
    ports:
      - "8002:8002"
    depends_on:
      - rag
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: notetaker-n8n
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_SECURE_COOKIE=false
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      - stt
      - qdrant
      - rag
    restart: unless-stopped
